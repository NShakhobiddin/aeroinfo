<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#00235E" />
<title>“Toshkent-AERO” IBK — Bojxona qoidalari</title>
<meta name="description" content="Bojxona qoidalari bo‘yicha tezkor yo‘riqnoma: aeroport, pochta, mobil qurilmalar, valyuta, kalkulyator." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* critical fallback (overridden by styles.css): the entry splash covers the
     page opaquely and full-screen from the first paint — no main content
     peeking on phones while assets load */
  html,body{ background:#F4F7FC; }
  #intro{ position:fixed; inset:0; height:100vh; height:100dvh; z-index:2000;
    background:#F4F7FC; display:flex; align-items:center; justify-content:center; }
  #intro.hide{ opacity:0; visibility:hidden; }
</style>
<link rel="stylesheet" href="css/styles.css?v=89" />
<script>
  // Verdant theme removed — always use the light skin
  (function(){ try{ localStorage.removeItem('aero_theme'); }catch(e){} document.documentElement.removeAttribute('data-theme'); })();
</script>
<link id="gfont-Inter" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap">
</head>
<body>

  <!-- per-screen custom background layer -->
  <div id="screen-bg" aria-hidden="true"></div>

  <template id="__bundler_thumbnail" data-bg-color="#00235E">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#00235E"/>
      <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
        <path d="M520 470 L520 360 L600 300 L680 360 L680 470"/>
        <path d="M480 470 L720 470"/>
        <path d="M560 470 L560 415 L640 415 L640 470"/>
      </g>
      <path d="M560 250 L700 215 a18 18 0 0 1 9 33 L660 262 L632 318 L612 312 L626 268 L582 280 L566 300 L548 295 L556 268 L520 258 a8 8 0 0 1 2-14 Z" fill="#ffffff" opacity="0.92"/>
      <text x="600" y="600" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="58" font-weight="700" letter-spacing="-1">Toshkent-AERO</text>
      <text x="600" y="650" text-anchor="middle" fill="#9fb6df" font-family="Inter, sans-serif" font-size="30">Bojxona qoidalari</text>
    </svg>
  </template>

  <!-- INTRO -->
  <div id="intro">
    <div class="intro-inner">
      <div class="intro-mark">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a1 1 0 0 0-.9.3l-.8.8a.8.8 0 0 0 .2 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 2.6 5.7a.8.8 0 0 0 1.3.2l.8-.8a1 1 0 0 0 .3-.9Z"/></svg>
      </div>
      <div id="intro-title" class="intro-title">Bojxonaga xush kelibsiz</div>
      <div id="intro-sub" class="intro-sub">Bojxona qoidalari bo‘yicha tezkor yo‘riqnoma</div>
      <div class="intro-bar"></div>
    </div>
  </div>

  <!-- HEADER -->
  <header class="site-header">
    <div class="wrap header-row">
      <div class="brand" data-nav="#/">
        <div class="brand-mark">
          <img class="brand-ico" src="assets/icons/home-white.png" alt="" aria-hidden="true" />
        </div>
        <span class="brand-text">
          <span id="brand-name" class="brand-name">“Toshkent-AERO” IBK</span>
          <span id="brand-sub" class="brand-sub">Ixtisoslashtirilgan bojxona kompleksi</span>
        </span>
      </div>
      <div class="header-spacer"></div>
      <div id="lang-switch" class="lang-switch"></div>
    </div>
  </header>

  <!-- APP -->
  <main id="app"></main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="wrap footer-row">
      <div class="fl">
        <div class="brand-mark">
          <img class="brand-ico" src="assets/icons/home-white.png" alt="" aria-hidden="true" />
        </div>
        <div>
          <div class="footer-name">“Toshkent-AERO”</div>
          <div class="footer-sub" id="footer-brandsub">Ixtisoslashtirilgan bojxona kompleksi</div>
        </div>
      </div>
      <p class="footer-note" id="footer-note"></p>
    </div>
  </footer>

  <script defer src="js/i18n.js?v=16"></script>
  <script defer src="js/icons.js?v=37"></script>
  <script defer src="js/illustrations.js?v=5"></script>
  <script defer src="js/calculator.js?v=12"></script>
  <script defer src="js/content-airport.js?v=54"></script>
  <script defer src="js/content-post.js?v=23"></script>
  <script defer src="js/content-prohibited.js?v=10"></script>
  <script defer src="js/content-misc.js?v=12"></script>
  <script defer src="js/app.js?v=79"></script>
  <script defer src="js/customize.js?v=6"></script>
  <script>
    // footer note localized after i18n loads
    document.addEventListener("DOMContentLoaded", function(){
      var lang = localStorage.getItem("aero_lang") || "uz";
      if(!window.I18N[lang]) lang = "uz";
      var fn = document.getElementById("footer-note");
      if(fn) fn.textContent = window.I18N[lang].footer_note;
      var fbs = document.getElementById("footer-brandsub");
      if(fbs) fbs.textContent = window.I18N[lang].brandSub;
    });
  </script>
</body>
</html>
